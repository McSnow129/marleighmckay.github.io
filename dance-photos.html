<style>
:root{--canvas:#f3f3e6;--ink:#1a1612;--fuchsia:#e44c81}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--canvas);font-family:'DM Sans',sans-serif;font-weight:300}
header{padding:3rem 1rem 1.5rem;max-width:1200px;margin:0 auto}
.label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fuchsia)}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);margin:.4rem 0 .6rem}
header p{font-size:.9rem;opacity:.7;max-width:560px;line-height:1.7}
header a{color:var(--canvas)}
h2{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fuchsia);font-weight:400;max-width:1200px;margin:2rem auto .8rem;padding:0 1rem}
.grid{max-width:1200px;margin:0 auto;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
figure img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;background:#2a241d}
figcaption{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-top:.5rem}
footer{max-width:1200px;margin:3rem auto 0;padding:1.5rem 1rem 3rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6;border-top:1px solid rgba(243,243,230,.15)}
footer a{color:var(--canvas)}
